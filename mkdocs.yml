site_name: Option Price Calibration
site_description: Documentation for the Continuous Time Option Pricing & Calibration platform.
site_url: http://localhost:8050/docs/
repo_url: https://github.com/example/option-calibration

use_directory_urls: false

theme: readthedocs

nav:
  - Home: index.md
  - Pricing Models:
      - Black-Scholes: models/black_scholes.md
      - Heston Model: models/heston.md
      - Merton Model: models/merton.md
      - Bates Model: models/bates.md
      - FFT Pricing Methodology: models/fft_pricing.md
  - Calibration:
      - Methodology: calibration/methodology.md
      - Algorithms: calibration/algorithms.md
      - Synthetic Data: calibration/synthetic_data.md
  - Visualization:
      - Dashboard Guide: visualization/dashboard.md
      - The Greeks: visualization/greeks.md
  - Financial Concepts:
      - Put-Call Parity: financial_concepts/put_call_parity.md
      - Delta Hedging: financial_concepts/delta_hedging.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.arithmatex:
      generic: true
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
