site_name: Option Price Calibration
site_description: Documentation for the Continuous Time Option Pricing & Calibration platform.
site_url: http://localhost:8050/docs/
repo_url: https://github.com/example/option-calibration

use_directory_urls: false

theme:
  name: material
  palette:
    - scheme: default
      primary: teal
      accent: purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: lime
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

nav:
  - Home: index.md
  - Pricing Models:
      - Heston Model: heston_model.md
      - Merton Model: merton_model.md
  - Calibration:
      - Methodology: calibration.md
  - Financial Concepts:
      - Put-Call Parity: put_call_parity.md
      - The Greeks: greeks.md
      - Delta Hedging: delta_hedging.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.arithmatex:
      generic: true
  - toc:
      permalink: true

extra_javascript:
  - javascripts/mathjax.js
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
